name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contrib Calendar

    steps:
      - uses: actions/checkout@v3

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Anurag-1401
          MAX_REPOS: 10
          SETTING_JSON: |
            {
              "username": "Anurag-1401",
              "backgroundColor": "#000000",
              "foregroundColor": "#6C63FF",
              "contributionColorArray": [
                "#1e1e2e",
                "#3B3B8A",
                "#5353B5",
                "#6C63FF",
                "#9B8FFF"
              ],
              "angle": -30,
              "outputFileGitHub": "profile-3d-contrib/profile-night-rainbow.svg"
            }

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: /tmp/profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
